# ===========================================================
# CodeMastery Course Platform — Spring Boot Configuration
# ===========================================================

# ---- Server ----
server.port=8080

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://localhost:3306/codemastery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Jackson (JSON serialization) ----
spring.jackson.serialization.fail-on-empty-beans=false

# ---- Logging ----
logging.level.com.codemastery=DEBUG
logging.level.org.hibernate.SQL=DEBUG
